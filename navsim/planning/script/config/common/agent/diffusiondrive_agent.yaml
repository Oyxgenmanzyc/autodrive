_target_: navsim.agents.diffusiondrive.transfuser_agent.TransfuserAgent
_convert_: 'all'

config:
  _target_: navsim.agents.diffusiondrive.transfuser_config.TransfuserConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  latent: False
  use_risk_gate: False
  use_historical_risk_attention: False
  use_temporal_risk_cross_attention: False
  use_memory_aux_loss: False
  use_step_brake_timing_loss: False
  use_endpoint_conditioned_temporal_transport: False
  use_risk_shadow_evaluator: False
  use_soft_risk_rescore: False
  use_longitudinal_safety_shield: True
  shield_absolute_max_progress_reduction: 5.0
  shield_after_safe_gap_ratio: 0.75
  shield_min_consecutive_unsafe_steps: 2
  shield_clearance_trigger_margin: 0.25

checkpoint_path: null
lr: 3e-4
